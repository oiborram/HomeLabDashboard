<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Acceso · HomeLab Dashboard</title>
    <link rel="stylesheet" href="/login.css">
  </head>
  <body>
    <main class="login-shell">
      <section class="login-card" aria-labelledby="loginTitle">
        <div class="telegram-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img">
            <path d="M21.7 3.5 18.6 20c-.2 1.2-.9 1.5-1.9.9l-4.8-3.5-2.3 2.2c-.3.3-.5.5-1 .5l.3-4.9 8.9-8c.4-.3-.1-.5-.6-.2L6.3 13.8l-4.7-1.5c-1-.3-1-1 .2-1.5L20.3 3.7c.9-.3 1.6.2 1.4-.2Z"/>
          </svg>
        </div>

        <p class="eyebrow">Ilicilabs HomeLab</p>
        <h1 id="loginTitle">Consulta Telegram</h1>
        <p class="intro">
          Abre el grupo privado desde tu móvil e introduce el código que muestra el bot.
        </p>

        <form id="loginForm" novalidate>
          <label for="accessCode">Código de acceso</label>
          <input
            id="accessCode"
            name="code"
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            pattern="[0-9]*"
            maxlength="8"
            placeholder="00000000"
            required
          >
          <button type="submit">Entrar</button>
        </form>

        <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
        <p class="hint" id="hint">El código se renueva cada 30 segundos.</p>
      </section>
    </main>

    <script src="/login.js" type="module"></script>
  </body>
</html>
